name: Playwright CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint check
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Lint tests
        run: npm run lint

  unit-api:
    name: Unit and API tests
    needs: lint
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Unit tests
        run: npm run test:unit
        env:
          CI: true

      - name: Run API tests
        run: npm run test:api
        env:
          CI: true

  e2e:
    name: Playwright E2E tests
    needs: lint
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14

  notify:
    name: Telegram Notification
    needs: [lint, unit-api, e2e]
    runs-on: ubuntu-latest
    if: always() # Запускается всегда, даже если предыдущие jobs упали

    steps:
      - name: Send Telegram Message
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            *Репозиторий:* `${{ github.repository }}`
            *Ветка:* `${{ github.head_ref || github.ref_name }}`
            *Автор:* ${{ github.actor }}

            *Статус проверок:*
            • Линтер: ${{ needs.lint.result == 'success' && '✅ Успешно' || '❌ Ошибка' }}
            • Unit / API: ${{ needs.unit-api.result == 'success' && '✅ Успешно' || (needs.unit-api.result == 'skipped' && '⏭️ Пропущено' || '❌ Ошибка') }}
            • E2E тесты: ${{ needs.e2e.result == 'success' && '✅ Успешно' || (needs.e2e.result == 'skipped' && '⏭️ Пропущено' || '❌ Ошибка') }}

            [Посмотреть лог сборки](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
