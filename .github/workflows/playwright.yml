name: Playwright CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # Позволяет запускать пайплайн вручную из веб-интерфейса GitHub

# Стратегия Concurrency (Параллелизм):
# Если разработчик пушит новый коммит в тот же Pull Request, старый (уже запущенный) 
# пайплайн автоматически отменяется. Это минимизирует время ожидания в очереди (Queue Time)
# и экономит бесплатные минуты CI для других участников команды.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # JOB 1: СТАТИЧЕСКИЙ АНАЛИЗ И СТИЛЬ КОДА (LINT & TYPE CHECK)
  # =========================================================================
  lint:
    name: Lint & Type check
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5 # v5 нативно поддерживает Node 24

      - name: Setup Node.js
        uses: actions/setup-node@v5 # v5 нативно поддерживает Node 24
        with:
          node-version: 24
          cache: npm # Кэширует директорию ~/.npm, чтобы ускорить команду `npm ci` при повторных запусках

      - name: Install npm dependencies
        run: npm ci # Чистая установка зависимостей строго по lock-файлу

      # Метрика: Статическая корректность TypeScript.
      # Проверяет отсутствие синтаксических ошибок и несоответствий типов во всем проекте.
      # Если в кодовой базе есть баги компиляции, пайплайн упадет прямо здесь, не тратя время на тесты.
      - name: TS Type Check
        run: npx tsc --noEmit 

      # Метрика: Соблюдение стайлгайдов (eslint).
      # Гарантирует, что код тестов и приложения написан аккуратно и по правилам, заданным в проекте.
      - name: Lint tests
        run: npm run lint

  # =========================================================================
  # JOB 2: UNIT ТЕСТЫ (Запускаются параллельно после успешного линтера)
  # =========================================================================
  unit:
    name: Unit tests
    needs: lint # Запустится только если джоба `lint` прошла успешно
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright dependencies
        run: npx playwright install --with-deps chromium # Установка браузеров и системных библиотек Ubuntu

      # Метрика: Работоспособность изолированных функций и компонентов.
      # Запускает конкретный профиль/проект `unit` внутри экосистемы Playwright.
      - name: Run Unit tests
        run: npm run test:unit
        env:
          CI: true

  # =========================================================================
  # JOB 3: API ТЕСТЫ (Запускаются параллельно на отдельной машине)
  # =========================================================================
  api:
    name: API tests
    needs: lint # Работает параллельно с Unit, E2E и Performance, экономя время сборки
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright dependencies
        run: npx playwright install --with-deps chromium

      # Метрика: Корректность интеграции бэкенд-эндпоинтов и контрактов данных.
      - name: Run API tests
        run: npm run test:api
        env:
          CI: true

  # =========================================================================
  # JOB 4: МЕТРИКИ ПРОИЗВОДИТЕЛЬНОСТИ И UX (Запускаются параллельно)
  # =========================================================================
  performance:
    name: UX Performance Audit
    needs: lint
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # Метрика: Качество UX интерфейса сайта (Core Web Vitals).
      # Lighthouse CI проверяет скорость рендеринга страниц сайта в изолированном контейнере.
      # Оператор `|| echo` гарантирует, что если сайт стал чуть медленнее, пайплайн выведет предупреждение,
      # но не заблокирует деплой (при желании блокировать, просто удалите `|| echo ...`).
      - name: Run Performance Audit (Lighthouse)
        run: |
          npm install -g @lhci/cli@0.13.x
          lhci autorun || echo "Lighthouse completed with warnings"
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  # =========================================================================
  # JOB 5: E2E ТЕСТЫ (Самая тяжелая задача, изолированная на своей машине)
  # =========================================================================
  e2e:
    name: Playwright E2E tests
    needs: lint
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # Оптимизация Pipeline Duration: Извлекаем версию Playwright для точного тегирования кэша
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT

      # Оптимизация: Проверяем, скачивали ли браузеры этой версии ранее.
      # Если да, они развернутся из кэша GitHub мгновенно, минуя скачивание из сети (~1.5 минуты экономии).
      - name: Cache Playwright Browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      # Скачиваем браузер только при промахе кэша (cache-hit != 'true')
      - name: Install Chromium and system dependencies
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # Метрика: Стабильность критических пользовательских сценариев.
      - name: Run Playwright E2E tests
        run: npm run test:e2e
        env:
          CI: true

      # Инструмент отладки: Сохраняем логи, скриншоты падений и файлы трассировки (.zip) в артефакты GitHub Actions.
      # Шаг выполнится, даже если тесты упали (`!cancelled()`), чтобы инженеры могли скачать и разобрать ошибки.
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14 # Метрика хранения: Ограничиваем жизнь артефактов 14 днями, чтобы не тратить дисковую квоту

  # =========================================================================
  # JOB 6: ПОЛНАЯ DORA-АНАЛИТИКА И СБОР МЕТРИК В TELEGRAM
  # =========================================================================
  notify:
    name: Telegram Notification & DORA Metrics
    needs: [lint, unit, api, performance, e2e]
    runs-on: ubuntu-latest
    if: always() # КРИТИЧЕСКОЕ ИСПРАВЛЕНИЕ: Теперь джоба запустится всегда, даже если тесты упали

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Метрика эффективности DevOps-процессов (DORA - Lead Time for Changes / Pipeline Duration):
      # Скрипт обращается по API к GitHub, достает точное время старта воркфлоу,
      # сравнивает с текущим временем и считает чистую скорость выполнения всего CI от А до Я.
      # Также собирается статистика по измененным строкам кода (diff_stats) и короткий хэш коммита.
      - name: Calculate Pipeline Duration and Diff Stats
        id: metrics
        if: always() # Считаем метрики даже при падении тестов
        run: |
          # 1. Расчет времени работы пайплайна
          START_TIME=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "${{ github.api_url }}/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            | jq -r '.run_started_at')
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          START_SECS=$(date -d "$START_TIME" +%s)
          NOW_SECS=$(date -d "$NOW" +%s)
          DURATION=$((NOW_SECS - START_SECS))
          MINUTES=$((DURATION / 60))
          SECONDS=$((DURATION % 60))
          echo "duration=${MINUTES}m ${SECONDS}s" >> $GITHUB_OUTPUT

          # 2. Получение хэша и статистики строк (Diff Stats)
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA=$(echo $COMMIT_SHA | cut -c1-7)
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

          COMMIT_DATA=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "${{ github.api_url }}/repos/${{ github.repository }}/commits/${COMMIT_SHA}")
          
          ADDITIONS=$(echo "$COMMIT_DATA" | jq -r '.stats.additions // 0')
          DELETIONS=$(echo "$COMMIT_DATA" | jq -r '.stats.deletions // 0')
          
          echo "diff_stats=+${ADDITIONS} / -${DELETIONS}" >> $GITHUB_OUTPUT
        shell: bash

      # Метрика: Коэффициент успешности пайплайнов (Pipeline Success Rate) и информирование команды.
      # Отправляет в Telegram детальный статус-трекер по каждой задаче с объёмом изменений в коде.
      - name: Send Telegram Message
        uses: appleboy/telegram-action@master
